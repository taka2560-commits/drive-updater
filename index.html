<!doctype html>
<html lang="ja" data-theme="earth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalUpdater</title>
    <!-- FOUC guard: apply saved theme before the bundle loads -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('localUpdater.theme');
          if (t === 'earth' || t === 'night' || t === 'light') {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>
    <!-- Fonts are bundled locally (see src/main.tsx); no external font requests. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
