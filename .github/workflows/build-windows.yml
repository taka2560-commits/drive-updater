name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-design-integration-j91xr5

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: LocalUpdater-Setup
          path: release/*.exe
